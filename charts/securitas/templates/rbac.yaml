{{- if .Values.rbac.create }}
{{- $rules := list (dict "apiGroups" (list "aquasecurity.github.io") "resources" (list "vulnerabilityreports") "verbs" (list "get" "list")) }}
{{- if .Values.config.namespaces }}
{{- range .Values.config.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "securitas.fullname" $ }}-read
  namespace: {{ . }}
  labels:
    {{- include "securitas.labels" $ | nindent 4 }}
rules:
  {{- toYaml $rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "securitas.fullname" $ }}-read
  namespace: {{ . }}
  labels:
    {{- include "securitas.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "securitas.fullname" $ }}-read
subjects:
  - kind: ServiceAccount
    name: {{ include "securitas.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- else }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "securitas.fullname" . }}-read
  labels:
    {{- include "securitas.labels" . | nindent 4 }}
rules:
  {{- toYaml $rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "securitas.fullname" . }}-read
  labels:
    {{- include "securitas.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "securitas.fullname" . }}-read
subjects:
  - kind: ServiceAccount
    name: {{ include "securitas.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
