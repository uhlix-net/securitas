{{- /* Generated secrets keep their value across upgrades (lookup). */ -}}
{{- if not .Values.auth.admin.existingSecret }}
{{- $name := include "securitas.adminSecret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "securitas.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.auth.admin.passwordKey }}: {{ if $old }}{{ index $old.data .Values.auth.admin.passwordKey }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
{{- end }}
{{- if .Values.database.bundled.enabled }}
{{- $name := include "securitas.dbSecret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "securitas.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ if $old }}{{ index $old.data "password" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
{{- end }}
{{- if not .Values.settings.secretKey.existingSecret }}
{{- $name := include "securitas.keySecret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
---
# Encrypts the secrets saved in the web UI (Settings). Losing or changing it makes them unreadable.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "securitas.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  key: {{ if $old }}{{ index $old.data "key" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
